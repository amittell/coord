# Example Secret holding COORD_AUTH_TOKEN.
#
# DO NOT commit a real token to git. This file is a template. In practice
# create the Secret imperatively so the value never touches your repo:
#
#   kubectl create secret generic coord-auth \
#     --from-literal=COORD_AUTH_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
#
# Or render it from a secrets manager (Vault, AWS Secrets Manager, SOPS,
# sealed-secrets, External Secrets Operator, etc.).
apiVersion: v1
kind: Secret
metadata:
  name: coord-auth
  labels:
    app.kubernetes.io/name: coord
type: Opaque
stringData:
  # Replace this with a strong random value before applying.
  COORD_AUTH_TOKEN: "replace-me-with-a-strong-random-token"
