# Renders the whcr.io pull secret from k3s Vault secret/infra/whcr
# (username/password) -- replaces ghcr-pull after the GitHub suspension
# stranded ghcr.io/amittell/* (see docs/releasing-without-github.md and
# kebabrack-lab docs/whcr-registry.md).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: coord-whcr-pull-vault
  namespace: coord
  labels:
    app.kubernetes.io/name: coord
    app.kubernetes.io/part-of: coord
spec:
  vaultAuthRef: vault/vault-auth
  mount: secret
  path: infra/whcr
  type: kv-v2
  refreshAfter: 24h
  destination:
    create: true
    name: whcr-pull
    type: kubernetes.io/dockerconfigjson
    labels:
      app.kubernetes.io/name: coord
      source: vault
    transformation:
      templates:
        .dockerconfigjson:
          text: |
            {"auths":{"whcr.io":{"auth":"{{ printf "%s:%s" .Secrets.username .Secrets.password | b64enc }}"}}}
