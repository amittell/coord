# Single-primary Postgres 16 for coord HA (design Sections 4, 7).
#
# This is app-tier HA, not full-system HA: one primary, own RWO PVC. PG is
# still a single write point for v1 (acceptable; restarts are fast and coord
# clients retry over a blip). Patroni/CloudNativePG is the follow-up.
#
# The coord-pg Secret below is a STUB. Do NOT commit real credentials. In prod
# the value is rendered from sealed-secrets / External Secrets / Vault. Create
# it imperatively if you are bootstrapping by hand, for example:
#
#   kubectl -n coord create secret generic coord-pg \
#     --from-literal=POSTGRES_USER=coord \
#     --from-literal=POSTGRES_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" \
#     --from-literal=POSTGRES_DB=coord \
#     --from-literal=COORD_DATABASE_URL="postgresql://coord:THEPASSWORD@coord-postgres.coord.svc.cluster.local:5432/coord"
#
# COORD_DATABASE_URL is consumed by the coord Deployment (deployment.yaml).
---
apiVersion: v1
kind: Secret
metadata:
  name: coord-pg
  namespace: coord
  labels:
    app.kubernetes.io/name: coord-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: coord
type: Opaque
stringData:
  # Placeholders -- replace via sealed-secret / External Secrets before applying.
  POSTGRES_USER: "replace-me-coord-user"
  POSTGRES_PASSWORD: "replace-me-with-a-strong-random-password"
  POSTGRES_DB: "replace-me-coord-db"
  # Full DSN coord connects with. Host is the headless Service below.
  COORD_DATABASE_URL: "postgresql://replace-me-coord-user:replace-me-with-a-strong-random-password@coord-postgres.coord.svc.cluster.local:5432/replace-me-coord-db"
---
apiVersion: v1
kind: Service
metadata:
  name: coord-postgres
  namespace: coord
  labels:
    app.kubernetes.io/name: coord-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: coord
spec:
  # Headless: stable per-pod DNS (coord-postgres-0.coord-postgres) for the
  # StatefulSet primary.
  clusterIP: None
  selector:
    app.kubernetes.io/name: coord-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: coord-postgres
  namespace: coord
  labels:
    app.kubernetes.io/name: coord-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: coord
spec:
  serviceName: coord-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: coord-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coord-postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: coord
    spec:
      securityContext:
        runAsNonRoot: true
        # 70 is the postgres uid/gid in the official postgres image.
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: coord-pg
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coord-pg
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: coord-pg
                  key: POSTGRES_DB
            # Keep the cluster data in a subdir so the PVC root (which may carry
            # a lost+found) is not used as PGDATA directly.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
        labels:
          app.kubernetes.io/name: coord-postgres
          app.kubernetes.io/component: database
          app.kubernetes.io/part-of: coord
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coord-postgres-allow-coord
  namespace: coord
  labels:
    app.kubernetes.io/name: coord-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: coord
spec:
  # Apply to the Postgres pod(s); default-deny ingress, then allow only coord.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: coord-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: coord
      ports:
        - protocol: TCP
          port: 5432
