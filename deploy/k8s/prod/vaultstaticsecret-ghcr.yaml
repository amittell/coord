apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: coord-ghcr-pull-vault
  namespace: coord
  labels:
    app.kubernetes.io/name: coord
    app.kubernetes.io/part-of: coord
spec:
  vaultAuthRef: vault/vault-auth
  mount: secret
  path: apps/k8s/coord
  type: kv-v2
  refreshAfter: 24h
  destination:
    create: true
    name: ghcr-pull
    type: kubernetes.io/dockerconfigjson
    labels:
      app.kubernetes.io/name: coord
      source: vault
    transformation:
      templates:
        .dockerconfigjson:
          text: |
            {"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .Secrets.ghcr_username .Secrets.ghcr_pat | b64enc }}"}}}
