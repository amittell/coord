apiVersion: apps/v1
kind: Deployment
metadata:
  name: coord
  namespace: coord
  labels:
    app.kubernetes.io/name: coord
    app.kubernetes.io/component: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: coord
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coord
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: coord
          image: ghcr.io/amittell/coord:v0.6.1@sha256:99e5ae1b9fee8180698ea52cf431c276a6d8077fbb231ad34e71aac0e955e12a
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: COORD_HOST
              value: "0.0.0.0"
            - name: COORD_PORT
              value: "8080"
            - name: COORD_DATABASE_PATH
              value: /data/coordination.db
            - name: COORD_ALLOW_INSECURE_NO_AUTH
              value: "true"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: coord-data
        - name: tmp
          emptyDir: {}
