apiVersion: apps/v1
kind: Deployment
metadata:
  name: coord
  namespace: coord
  labels:
    app.kubernetes.io/name: coord
    app.kubernetes.io/component: api
spec:
  # HA (2026-07-17): 3 replicas on the CNPG pair (coord's PostgresStore uses
  # pg_advisory_xact_lock per repo, so replicas are safe cross-node). Odd
  # count avoids ties; RollingUpdate maxUnavailable=0 = zero-downtime deploys.
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: coord
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coord
        app.kubernetes.io/component: api
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: coord
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      enableServiceLinks: false   # else k8s injects COORD_PORT=tcp://... (breaks config)
      imagePullSecrets:
        - name: whcr-pull
      containers:
        - name: coord
          image: whcr.io/coord/coord:v0.46.0-pg@sha256:d35ad026273fdd5cf2d52fcb344c6e5fa4f27950029bc8a37ebb5a11a2e02a6f
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: COORD_HOST
              value: "0.0.0.0"
            - name: COORD_PORT
              value: "8080"
            - name: COORD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: coord-db-credentials-url
                  key: COORD_DATABASE_URL
            # v0.29: reject the shared COORD_AUTH_TOKEN once every
            # engineer has been migrated to a per-engineer token
            # (via `coord tokens create` against this same db). The
            # shared token still lives in the coord-auth Secret for
            # backwards compat but is ignored by the auth middleware
            # when this flag is set.
            - name: COORD_REQUIRE_PER_ENGINEER_TOKEN
              value: "true"
            # v0.38: optional OpenTelemetry tracing. The image bundles the
            # OTel stack (requirements-otel.txt), so enabling it in prod is
            # just these env vars; spans export over OTLP/HTTP to Tempo.
            # Tracing fails open -- a Tempo outage never affects coord's
            # own startup or request handling.
            - name: COORD_OTEL_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.tempo.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "coord"
          envFrom:
            - secretRef:
                name: coord-auth
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
