apiVersion: apps/v1
kind: Deployment
metadata:
  name: coord
  namespace: coord
  labels:
    app.kubernetes.io/name: coord
    app.kubernetes.io/component: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: coord
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coord
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: coord
          image: ghcr.io/amittell/coord:v0.29.1@sha256:16c1df33cb05a1494799d1e7eeb41df035665302c721d2c183cc566572f85494
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: COORD_HOST
              value: "0.0.0.0"
            - name: COORD_PORT
              value: "8080"
            - name: COORD_DATABASE_PATH
              value: /data/coordination.db
            # v0.29: reject the shared COORD_AUTH_TOKEN once every
            # engineer has been migrated to a per-engineer token
            # (via `coord tokens create` against this same db). The
            # shared token still lives in the coord-auth Secret for
            # backwards compat but is ignored by the auth middleware
            # when this flag is set.
            - name: COORD_REQUIRE_PER_ENGINEER_TOKEN
              value: "true"
          envFrom:
            - secretRef:
                name: coord-auth
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: coord-data
        - name: tmp
          emptyDir: {}
