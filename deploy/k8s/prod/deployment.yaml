apiVersion: apps/v1
kind: Deployment
metadata:
  name: coord
  namespace: coord
  labels:
    app.kubernetes.io/name: coord
    app.kubernetes.io/component: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: coord
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coord
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: whcr-pull
      containers:
        - name: coord
          image: whcr.io/coord/coord:v0.46.0@sha256:937e5ec76131dbbdf87800aa26e4d583c2c9adeb25904b46fc383dcfc32ec1fb
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: COORD_HOST
              value: "0.0.0.0"
            - name: COORD_PORT
              value: "8080"
            - name: COORD_DATABASE_PATH
              value: /data/coordination.db
            # v0.29: reject the shared COORD_AUTH_TOKEN once every
            # engineer has been migrated to a per-engineer token
            # (via `coord tokens create` against this same db). The
            # shared token still lives in the coord-auth Secret for
            # backwards compat but is ignored by the auth middleware
            # when this flag is set.
            - name: COORD_REQUIRE_PER_ENGINEER_TOKEN
              value: "true"
            # v0.38: optional OpenTelemetry tracing. The image bundles the
            # OTel stack (requirements-otel.txt), so enabling it in prod is
            # just these env vars; spans export over OTLP/HTTP to Tempo.
            # Tracing fails open -- a Tempo outage never affects coord's
            # own startup or request handling.
            - name: COORD_OTEL_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.tempo.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "coord"
          envFrom:
            - secretRef:
                name: coord-auth
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: coord-data
        - name: tmp
          emptyDir: {}
