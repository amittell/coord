apiVersion: apps/v1
kind: Deployment
metadata:
  name: coord
  namespace: coord
  labels:
    app.kubernetes.io/name: coord
    app.kubernetes.io/component: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: coord
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coord
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: coord
          image: ghcr.io/amittell/coord:v0.43.0@sha256:7f6791b62ba54ab70a61bb34ba0463aa17e6cdd6e8c2e2f5e6f435b33014ad47
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: COORD_HOST
              value: "0.0.0.0"
            - name: COORD_PORT
              value: "8080"
            # Stateless HA: coord connects to the in-cluster Postgres primary
            # (postgres.yaml). COORD_DATABASE_URL takes precedence over the
            # deprecated COORD_DATABASE_PATH alias, so no PVC is mounted here.
            - name: COORD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: coord-pg
                  key: COORD_DATABASE_URL
            # v0.29: reject the shared COORD_AUTH_TOKEN once every
            # engineer has been migrated to a per-engineer token
            # (via `coord tokens create` against this same db). The
            # shared token still lives in the coord-auth Secret for
            # backwards compat but is ignored by the auth middleware
            # when this flag is set.
            - name: COORD_REQUIRE_PER_ENGINEER_TOKEN
              value: "true"
            # v0.38: optional OpenTelemetry tracing. The image bundles the
            # OTel stack (requirements-otel.txt), so enabling it in prod is
            # just these env vars; spans export over OTLP/HTTP to Tempo.
            # Tracing fails open -- a Tempo outage never affects coord's
            # own startup or request handling.
            - name: COORD_OTEL_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.tempo.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "coord"
          envFrom:
            - secretRef:
                name: coord-auth
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
