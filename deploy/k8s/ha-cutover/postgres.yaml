# Single-primary Postgres 16 for coord HA (design Sections 4, 7).
#
# This is app-tier HA, not full-system HA: one primary, own RWO PVC. PG is
# still a single write point for v1 (acceptable; restarts are fast and coord
# clients retry over a blip). Patroni/CloudNativePG is the follow-up.
#
# The coord-pg Secret is deliberately NOT in this file. This manifest is
# `kubectl apply`d verbatim by the cutover runbook, and bundling the stub
# Secret here would clobber the real credentials with placeholders on apply
# (failing coord's PG auth mid-cutover, or baking placeholder credentials
# into PGDATA if applied before Postgres's first boot). Create the real
# Secret from sealed-secrets / External Secrets / Vault, or imperatively --
# see secret.example.yaml in this directory for the required keys and a
# bootstrap command. Both the StatefulSet below and the coord Deployment
# (deployment.yaml) reference it by name (coord-pg).
---
apiVersion: v1
kind: Service
metadata:
  name: coord-postgres
  namespace: coord
  labels:
    app.kubernetes.io/name: coord-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: coord
spec:
  # Headless: stable per-pod DNS (coord-postgres-0.coord-postgres) for the
  # StatefulSet primary.
  clusterIP: None
  selector:
    app.kubernetes.io/name: coord-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: coord-postgres
  namespace: coord
  labels:
    app.kubernetes.io/name: coord-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: coord
spec:
  serviceName: coord-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: coord-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coord-postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: coord
    spec:
      securityContext:
        runAsNonRoot: true
        # 70 is the postgres uid/gid in the official postgres image.
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          # Pinned minor + digest, matching the digest-pinning policy the
          # coord image follows. A floating `postgres:16` tag plus
          # IfNotPresent would let a rescheduled pod silently jump Postgres
          # minor versions depending on what each node happened to cache.
          image: postgres:16.14@sha256:be01cf82fc7dbba824acf0a82e150b4b360f3ff93c6631d7844af431e841a95c
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: coord-pg
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coord-pg
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: coord-pg
                  key: POSTGRES_DB
            # Keep the cluster data in a subdir so the PVC root (which may carry
            # a lost+found) is not used as PGDATA directly.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
        labels:
          app.kubernetes.io/name: coord-postgres
          app.kubernetes.io/component: database
          app.kubernetes.io/part-of: coord
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coord-postgres-allow-coord
  namespace: coord
  labels:
    app.kubernetes.io/name: coord-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: coord
spec:
  # Apply to the Postgres pod(s); default-deny ingress, then allow only coord.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: coord-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: coord
      ports:
        - protocol: TCP
          port: 5432
