# EXAMPLE ONLY -- the coord-pg Secret with placeholder values. Never
# `kubectl apply` this file as-is and never commit real credentials.
#
# This stub lives in its own file (mirroring deploy/k8s/secret.example.yaml)
# so that the runbook's `kubectl apply -f deploy/k8s/ha-cutover/postgres.yaml`
# can never clobber the real Secret with these placeholders: applying the
# stub over live credentials fails coord's PG auth mid-cutover, and applying
# it before Postgres's first boot bakes placeholder credentials into PGDATA
# on the PVC.
#
# In prod the real Secret is rendered from sealed-secrets / External Secrets /
# Vault. Create it imperatively if you are bootstrapping by hand, for example:
#
#   kubectl -n coord create secret generic coord-pg \
#     --from-literal=POSTGRES_USER=coord \
#     --from-literal=POSTGRES_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" \
#     --from-literal=POSTGRES_DB=coord \
#     --from-literal=COORD_DATABASE_URL="postgresql://coord:THEPASSWORD@coord-postgres.coord.svc.cluster.local:5432/coord"
#
# COORD_DATABASE_URL is consumed by the coord Deployment (deployment.yaml);
# the POSTGRES_* keys are consumed by the StatefulSet (postgres.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: coord-pg
  namespace: coord
  labels:
    app.kubernetes.io/name: coord-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: coord
type: Opaque
stringData:
  # Placeholders -- replace via sealed-secret / External Secrets before use.
  POSTGRES_USER: "replace-me-coord-user"
  POSTGRES_PASSWORD: "replace-me-with-a-strong-random-password"
  POSTGRES_DB: "replace-me-coord-db"
  # Full DSN coord connects with. Host is the headless coord-postgres Service.
  COORD_DATABASE_URL: "postgresql://replace-me-coord-user:replace-me-with-a-strong-random-password@coord-postgres.coord.svc.cluster.local:5432/replace-me-coord-db"
