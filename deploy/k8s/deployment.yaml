# Reference Deployment for the coord service.
#
# This is a starting point, not a distribution recommendation. Adjust the
# namespace, image tag, resource sizing, node selection, security policy,
# and ingress/TLS termination to match your cluster.
#
# Notes:
# - Single replica only. The service uses a local SQLite file on /data and
#   is not safe to scale horizontally until the storage layer is replaced.
# - strategy.type is Recreate so the PVC is released before a new pod
#   attaches, avoiding multi-writer SQLite corruption.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coord
  labels:
    app.kubernetes.io/name: coord
    app.kubernetes.io/component: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: coord
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coord
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coord
          # Replace YOUR_ORG with the GitHub org that owns the published
          # image. Pin to a specific tag (e.g. v0.1.0) in real deployments
          # rather than using :latest.
          image: ghcr.io/YOUR_ORG/coord:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: COORD_HOST
              value: "0.0.0.0"
            - name: COORD_PORT
              value: "8080"
            - name: COORD_DATABASE_PATH
              value: /data/coordination.db
          envFrom:
            # Supplies COORD_AUTH_TOKEN (and any other sensitive settings).
            # See secret.example.yaml for the expected shape.
            - secretRef:
                name: coord-auth
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: coord-data
        - name: tmp
          emptyDir: {}
