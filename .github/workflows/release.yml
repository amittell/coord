name: release

on:
  push:
    tags:
      - "v*"
  # Manual trigger so maintainers can push a tagged image without cutting
  # a real git tag (handy for release candidates or rebuilding an old tag).
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag (e.g. v0.1.0-rc1). Used as the image tag; :latest is NOT pushed on manual runs."
        required: true
        type: string

permissions:
  contents: write       # needed for softprops/action-gh-release on tag pushes
  packages: write       # needed to push to GHCR
  id-token: write       # needed for build provenance attestation (SLSA)
  attestations: write   # needed for actions/attest-build-provenance

# Never cancel an in-flight release: a half-pushed multi-arch image is worse
# than a short queue. Grouping by workflow+ref keeps two tag pushes from
# racing each other for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Registry and repo name are overridable via repo/org Actions variables so
# GitHub Enterprise users can point at their own container registry without
# forking the workflow. Defaults preserve the upstream GHCR behavior.
#   vars.IMAGE_REGISTRY -> e.g. containers.ghe.example.com
#   vars.IMAGE_REPO     -> e.g. platform/coord
# The format() call wraps the default so an unset vars.IMAGE_REPO (empty
# string) still picks up the owner-prefixed fallback rather than leaking an
# empty value through the || operator.
env:
  REGISTRY: ${{ vars.IMAGE_REGISTRY || 'ghcr.io' }}
  IMAGE_REPO: ${{ vars.IMAGE_REPO || format('{0}/coord', github.repository_owner) }}

jobs:
  publish-image:
    name: Build and push container image
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ vars.IMAGE_REGISTRY || 'ghcr.io' }}/${{ vars.IMAGE_REPO || format('{0}/coord', github.repository_owner) }}
    outputs:
      image-name: ${{ steps.image.outputs.name }}
      image-digest: ${{ steps.build.outputs.digest }}
      version-tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3  # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Log in to container registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive lowercase image name
        id: image
        env:
          RAW_IMAGE: ${{ env.IMAGE_NAME }}
        run: |
          lower=$(printf '%s' "$RAW_IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "name=$lower" >> "$GITHUB_OUTPUT"

      # Resolve the image version tag.
      #  - tag push:           use github.ref_name (e.g. v0.1.0)
      #  - workflow_dispatch:  use the user-supplied inputs.version
      - name: Resolve version tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_VERSION"
          else
            tag="$REF_NAME"
          fi
          if [ -z "$tag" ]; then
            echo "::error::could not resolve image version tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Build the tag list.
      #  - tag push:           push both :<version> and :latest
      #  - workflow_dispatch:  push ONLY :<version> so we do not clobber
      #                        the production :latest pointer with an rc.
      - name: Compose image tags
        id: tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo 'tags<<EOF'
            echo "${IMAGE}:${VERSION}"
            if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
              echo "${IMAGE}:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # BuildKit-native supply-chain signals:
      #  - sbom: true emits an SPDX SBOM as an attestation attached to the
      #    image manifest (separate OCI artifact referenced by the index).
      #  - provenance: mode=max emits a SLSA provenance attestation with
      #    full build metadata (source, builder, materials, invocation).
      # These live in the registry next to the image and can be inspected
      # with `docker buildx imagetools inspect <ref> --format '{{json .SBOM}}'`
      # or pulled via `cosign download sbom <ref>`.
      - name: Build and push image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          sbom: true
          provenance: mode=max

      # Emit an SLSA build provenance attestation for the pushed image.
      # Consumers can verify supply-chain integrity with `gh attestation verify`.
      # Requires id-token: write + attestations: write (declared above).
      #
      # actions/attest-build-provenance requires GitHub Enterprise Server
      # 3.10 or later with the attestations feature enabled. Operators on
      # older GHES (or any environment where the API is unavailable) can
      # set the repo/org variable SKIP_ATTESTATION=true to bypass this step
      # without editing the workflow.
      - name: Attest build provenance
        if: ${{ vars.SKIP_ATTESTATION != 'true' }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Install cosign for keyless signing. The installer fetches a fixed
      # cosign CLI release and puts it on PATH. Pinned by SHA per the
      # project's third-party action pinning policy.
      #
      # Each of the four supply-chain signals (buildkit-sbom, buildkit-
      # provenance, attest-build-provenance, cosign) is independent. We
      # guard cosign with `always() && SKIP_SIGNING != true` so a failure
      # in an earlier signal (e.g. attest-build-provenance on a private
      # user-owned repo) does not cascade-skip the remaining signals.
      - name: Install cosign
        if: ${{ always() && vars.SKIP_SIGNING != 'true' && steps.build.outputs.digest != '' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.0.6"

      # Sign the pushed image with cosign in keyless mode. The signature
      # is issued against this workflow's OIDC identity (no private keys
      # stored anywhere) and uploaded to the Rekor transparency log.
      # Consumers verify with `cosign verify --certificate-identity-regexp
      # '^https://github.com/<owner>/<repo>/.github/workflows/release.yml@'
      # --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
      # <image>@<digest>`. Gated behind SKIP_SIGNING=true for operators on
      # networks that cannot reach the Sigstore public good instance.
      - name: Sign image with cosign (keyless)
        if: ${{ always() && vars.SKIP_SIGNING != 'true' && steps.build.outputs.digest != '' }}
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_AND_DIGEST: "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"
        run: |
          cosign sign --yes "${IMAGE_AND_DIGEST}"

      # Create a GitHub Release with auto-generated notes, only for real
      # tag pushes. Skipped on workflow_dispatch since there is no tag to
      # attach the release to.
      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # v3.0.1
        with:
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Container image: `${{ steps.image.outputs.name }}:${{ steps.version.outputs.tag }}`
            Digest: `${{ steps.build.outputs.digest }}`

  # Publish the Python package to PyPI via OIDC trusted publishing.
  # No API tokens stored in repo secrets -- pypa/gh-action-pypi-publish
  # exchanges this workflow's GitHub OIDC identity for a short-lived
  # PyPI token at publish time. Requires a pending publisher registered
  # at https://pypi.org/manage/account/publishing/ before the first
  # publish succeeds; bootstrap via:
  #   project name = coord-mcp-server
  #   owner        = amittell
  #   repo         = coord
  #   workflow     = release.yml
  #   environment  = pypi
  #
  # Tag pushes publish to PyPI; workflow_dispatch publishes nothing
  # (no version bump means no new artifact to upload).
  publish-pypi:
    name: Publish Python package to PyPI
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    environment:
      name: pypi
      url: https://pypi.org/p/coord-mcp-server
    permissions:
      id-token: write       # required for OIDC trusted publishing
      contents: read        # required for checkout
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Install build backend
        run: python -m pip install --upgrade build

      - name: Verify tag matches pyproject version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          pyproject_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          tag_version="${REF_NAME#v}"
          if [ "$pyproject_version" != "$tag_version" ]; then
            echo "::error::pyproject.toml version ($pyproject_version) does not match git tag ($tag_version)" >&2
            exit 1
          fi
          echo "Version match: $pyproject_version == $tag_version"

      - name: Build sdist + wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.13.0
        with:
          # Trusted publisher exchange happens automatically when the
          # workflow's OIDC token is presented to PyPI; no api token needed.
          # Skip-existing handles re-runs of an already-published version
          # gracefully.
          skip-existing: true

  # After a real tag push, rewrite deploy/k8s/prod/deployment.yaml so the
  # kebabrack live overlay picks up the image we just built. Without this
  # job the manifest drifts behind every release and ArgoCD keeps pinning
  # the cluster to whatever version a human last hand-edited. See
  # docs/design/roadmap.md "v0.28.1" for the original gap (a 14-version
  # drift between v0.13.0 and v0.28.0).
  #
  # Skipped on workflow_dispatch: manual rebuilds and release candidates
  # should never silently flip production.
  bump-manifest:
    name: Bump prod deployment manifest
    runs-on: ubuntu-latest
    needs: publish-image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Land the bump on main, not on the tag ref. The tag is
          # immutable; what ArgoCD watches is the moving main branch.
          ref: main
          fetch-depth: 0
          # Default GITHUB_TOKEN has contents:write at the workflow level,
          # which lets a subsequent `git push origin HEAD:main` succeed.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rewrite image pin in deploy/k8s/prod/deployment.yaml
        env:
          IMAGE: ${{ needs.publish-image.outputs.image-name }}
          VERSION: ${{ needs.publish-image.outputs.version-tag }}
          DIGEST: ${{ needs.publish-image.outputs.image-digest }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          manifest = pathlib.Path("deploy/k8s/prod/deployment.yaml")
          image = os.environ["IMAGE"]
          version = os.environ["VERSION"]
          digest = os.environ["DIGEST"]
          if not (image and version and digest):
              raise SystemExit(
                  f"missing required input: IMAGE={image!r} VERSION={version!r} "
                  f"DIGEST={digest!r}"
              )

          target = f"{image}:{version}@{digest}"
          text = manifest.read_text(encoding="utf-8")
          # The pinned reference lives on the first `image:` line in the
          # Deployment spec; match its leading indent and value.
          pattern = re.compile(r"^(\s*image:\s+)\S+(\s*)$", re.MULTILINE)
          new_text, count = pattern.subn(rf"\g<1>{target}\g<2>", text, count=1)
          if count != 1:
              raise SystemExit(
                  f"no image: line matched in {manifest}; cannot auto-bump"
              )
          if new_text == text:
              print(f"manifest already pins {target}; nothing to do")
              raise SystemExit(0)
          manifest.write_text(new_text, encoding="utf-8")
          print(f"updated {manifest} -> {target}")
          PY

      - name: Commit, push, and retag at the deployment-ready commit
        env:
          VERSION: ${{ needs.publish-image.outputs.version-tag }}
          DIGEST: ${{ needs.publish-image.outputs.image-digest }}
        run: |
          # Identity matches the GitHub Actions bot so the commit shows
          # up cleanly in repo history.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git diff --quiet -- deploy/k8s/prod/deployment.yaml; then
            echo "deploy/k8s/prod/deployment.yaml unchanged after rewrite; skipping commit"
            exit 0
          fi

          git add deploy/k8s/prod/deployment.yaml
          # `[skip ci]` in the commit message is a GitHub Actions
          # convention: any workflow triggered by this push is skipped.
          # release.yml only triggers on tag pushes (and the moved
          # tag below is pushed by GITHUB_TOKEN, which GitHub
          # documents as NOT triggering downstream workflows), but
          # ci.yml would otherwise run a full test matrix on a
          # one-line manifest change. ArgoCD watches git directly
          # and reconciles regardless of CI status.
          git commit \
            -m "ops: bump prod deployment to ${VERSION}" \
            -m "Automated by .github/workflows/release.yml after the publish-image job for ${VERSION} succeeded. Image digest: ${DIGEST}." \
            -m "[skip ci]"

          # Rebase against any commits that landed on main while the
          # release was building, then push. Failure here surfaces to
          # the operator instead of silently leaving the manifest behind.
          git pull --rebase origin main
          git push origin HEAD:main

          # Move the version tag forward to this new commit.
          #
          # When the maintainer pushes a tag locally, the tag points
          # at the commit that bumped pyproject.toml + CHANGELOG --
          # but the manifest in that commit still pins the PREVIOUS
          # image. After this job runs, main carries a manifest pin
          # to the new image. Without this retag, ``git describe HEAD``
          # would keep resolving to the previous version tag (because
          # the maintainer's tagged commit is on a now-orphan branch
          # after the rebase above) and the tag's tree would describe
          # an outdated deployment state.
          #
          # We move the tag forward to the bot's just-committed
          # commit, which has:
          #   1. the new pyproject + CHANGELOG (from the rebased
          #      commit it sits on top of)
          #   2. the manifest pinned to the freshly-published image
          # That commit IS the deployment-ready snapshot, and is
          # what ``git checkout vX.Y.Z`` should land on.
          #
          # Image artefacts (the cosigned image digest, the BuildKit
          # + GitHub provenance attestations, the GitHub Release
          # body, the PyPI wheel) are all keyed off the IMAGE digest,
          # not the git ref -- moving the tag does not invalidate any
          # of them. The GitHub Release page's "Tagged at" timestamp
          # and commit link update to the new commit, which is the
          # intended outcome.
          #
          # The force-push uses ``GITHUB_TOKEN`` (the workflow's
          # default token), and GitHub guarantees pushes made by that
          # token do not trigger workflows -- so the retag does not
          # recursively re-run release.yml. See:
          # https://docs.github.com/en/actions/security-guides/automatic-token-authentication
          # ("When you use the repository's GITHUB_TOKEN ... events ...
          # will not create a new workflow run.")
          git tag -f -a "${VERSION}" \
            -m "${VERSION} (deployment-ready commit; manifest pins ${DIGEST})" \
            HEAD
          git push origin "${VERSION}" --force
