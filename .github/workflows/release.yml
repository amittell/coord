name: release candidate validation and PyPI OIDC
run-name: ${{ inputs.oidc_trigger_tag != '' && format('PyPI OIDC {0}', inputs.oidc_trigger_tag) || format('candidate {0}', inputs.version) }}

on:
  # Both modes run the workflow committed on protected main. The signed
  # operation tag is inert authorization data, never an Actions trigger.
  workflow_dispatch:
    inputs:
      version:
        description: "Candidate label (e.g. v0.49.0-review1); never promoted to an official tag."
        required: false
        type: string
      oidc_trigger_tag:
        description: "Vault-signed coord-pypi-v... authorization tag; release automation only."
        required: false
        type: string

permissions:
  contents: read

# One operation tag maps to one serialized run. A repeated dispatch waits
# behind the first; after it completes the unprivileged classifier observes
# exact PyPI state and skips the protected environment.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.oidc_trigger_tag || inputs.version }}
  cancel-in-progress: false

# Registry and repo name are overridable via repo/org Actions variables so
# GitHub Enterprise users can point at their own container registry without
# forking the workflow. Defaults preserve the upstream GHCR behavior.
#   vars.IMAGE_REGISTRY -> e.g. containers.ghe.example.com
#   vars.IMAGE_REPO     -> e.g. platform/coord
# The format() call wraps the default so an unset vars.IMAGE_REPO (empty
# string) still picks up the owner-prefixed fallback rather than leaking an
# empty value through the || operator.
env:
  REGISTRY: ${{ vars.IMAGE_REGISTRY || 'ghcr.io' }}
  IMAGE_REPO: ${{ vars.IMAGE_REPO || format('{0}/coord', github.repository_owner) }}
  BUILDER_ID: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  # A release is the final point at which dormant-but-supported PostgreSQL
  # regressions must be caught. Reuse the same real-Postgres full suite that
  # runs on backend-sensitive PRs; publishing cannot start until it passes.
  postgres-gate:
    name: Verify PostgreSQL backend before publishing
    uses: ./.github/workflows/postgres.yml
    permissions:
      contents: read

  publish-image:
    name: Build, authenticate, and retain candidate image
    needs: postgres-gate
    if: inputs.oidc_trigger_tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE_NAME: ${{ vars.IMAGE_REGISTRY || 'ghcr.io' }}/${{ vars.IMAGE_REPO || format('{0}/coord', github.repository_owner) }}
    outputs:
      image-name: ${{ steps.image.outputs.name }}
      image-digest: ${{ steps.build.outputs.digest }}
      version-tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3  # v4.1.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Log in to container registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive lowercase image name
        id: image
        env:
          RAW_IMAGE: ${{ env.IMAGE_NAME }}
        run: |
          lower=$(printf '%s' "$RAW_IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "name=$lower" >> "$GITHUB_OUTPUT"

      - name: Resolve candidate label
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          tag="$INPUT_VERSION"
          if [[ ! "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,104}$ ]]; then
            echo "::error::candidate label must be one safe Docker tag component (1..105 chars)" >&2
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Install pinned crane for fail-closed tag checks
        shell: bash
        run: |
          archive="$RUNNER_TEMP/go-containerregistry_Linux_x86_64.tar.gz"
          curl --fail --location --retry 3 \
            --output "$archive" \
            https://github.com/google/go-containerregistry/releases/download/v0.21.7/go-containerregistry_Linux_x86_64.tar.gz
          printf '%s  %s\n' \
            1a57bc98207fa1c0d04bf760699099e26f8383499bfd55b99c1b919a928a7230 \
            "$archive" \
            | sha256sum --check -
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" crane
          test "$("$RUNNER_TEMP/crane" version)" = "0.21.7"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Compose candidate image tag
        id: tags
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.version.outputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          printf 'tags=%s\n' \
            "${IMAGE}:candidate-${VERSION}-${COMMIT_SHA:0:12}" \
            >> "$GITHUB_OUTPUT"

      # Candidate writes are create-only too. Authentication, transport, and
      # server failures are not evidence that the tag is absent.
      - name: Refuse to republish an existing candidate tag
        env:
          CANDIDATE: ${{ steps.tags.outputs.tags }}
        run: |
          probe_error="$(mktemp)"
          trap 'rm -f "$probe_error"' EXIT
          if crane digest "$CANDIDATE" >/dev/null 2>"$probe_error"; then
            echo "::error::$CANDIDATE already exists in the registry" >&2
            exit 1
          fi
          if ! grep -Fq "MANIFEST_UNKNOWN" "$probe_error"; then
            cat "$probe_error" >&2
            echo "::error::could not prove $CANDIDATE is absent" >&2
            exit 1
          fi

      # BuildKit-native supply-chain signals:
      #  - sbom: true emits an SPDX SBOM as an attestation attached to the
      #    image manifest (separate OCI artifact referenced by the index).
      #  - provenance: mode=max emits a SLSA provenance attestation with
      #    full build metadata (source, builder, materials, invocation).
      # These live in the registry next to the image and can be inspected
      # with `docker buildx imagetools inspect <ref> --format '{{json .SBOM}}'`
      # or pulled via `cosign download sbom <ref>`.
      - name: Build and push image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          sbom: generator=docker.io/docker/buildkit-syft-scanner@sha256:79e7b013cbec16bbb436f312819a49a4a57752b2270c1a9332ae1a10fcc82a68
          provenance: mode=max,builder-id=${{ env.BUILDER_ID }}

      # Emit an SLSA build provenance attestation for the pushed image.
      # Consumers can verify supply-chain integrity with `gh attestation verify`.
      # Requires id-token: write + attestations: write (declared above).
      #
      # actions/attest-build-provenance requires GitHub Enterprise Server
      # 3.10 or later with the attestations feature enabled. Operators on
      # older GHES (or any environment where the API is unavailable) can
      # set the repo/org variable SKIP_ATTESTATION=true to bypass this step
      # without editing the workflow.
      - name: Attest build provenance
        if: ${{ vars.SKIP_ATTESTATION != 'true' }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify both platform SBOM and provenance attestations
        env:
          IMAGE_AND_DIGEST: "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"
        run: |
          python3 scripts/verify_image_attestations.py \
            --image "$IMAGE_AND_DIGEST" \
            --builder-id "$BUILDER_ID" \
            --platform linux/amd64 \
            --platform linux/arm64

      # Candidate authentication never has an unsigned escape hatch. This
      # keyless identity is deliberately candidate-only; official releases
      # use release/coord-release.pub through scripts/release.sh.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.0.6"

      - name: Sign and verify candidate digest with workflow identity
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_AND_DIGEST: "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"
          EXPECTED_IDENTITY: "https://github.com/${{ github.workflow_ref }}"
        run: |
          cosign sign --yes "${IMAGE_AND_DIGEST}"
          cosign verify \
            --certificate-identity "$EXPECTED_IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE_AND_DIGEST" >/dev/null

  # PyPI is the only official artifact GitHub may publish. The existing
  # Trusted Publisher exchanges this job's OIDC identity for a short-lived
  # PyPI token, but only after the committed release key verifies a signed
  # authorization produced by scripts/release.sh. GitHub has no WritHub,
  # WHCR-push, Vault, version-tag, or deployment credential.
  #   project name = coord-mcp-server
  #   owner        = amittell
  #   repo         = coord
  #   workflow     = release.yml
  #   environment  = pypi
  authorize-pypi:
    name: Verify Vault-authorized PyPI release
    needs: postgres-gate
    runs-on: ubuntu-latest
    if: inputs.oidc_trigger_tag != '' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    outputs:
      version: ${{ steps.authorization.outputs.version }}
      image: ${{ steps.authorization.outputs.image }}
      packages: ${{ steps.authorization.outputs.packages }}
      source_commit: ${{ steps.authorization.outputs.source_commit }}
      operation_id: ${{ steps.authorization.outputs.operation_id }}
      build_python: ${{ steps.authorization.outputs.build_python }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned crane
        shell: bash
        run: |
          archive="$RUNNER_TEMP/go-containerregistry_Linux_x86_64.tar.gz"
          curl --fail --location --retry 3 \
            --output "$archive" \
            https://github.com/google/go-containerregistry/releases/download/v0.21.7/go-containerregistry_Linux_x86_64.tar.gz
          printf '%s  %s\n' \
            1a57bc98207fa1c0d04bf760699099e26f8383499bfd55b99c1b919a928a7230 \
            "$archive" \
            | sha256sum --check -
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" crane
          test "$("$RUNNER_TEMP/crane" version)" = "0.21.7"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.0.6"

      - name: Verify Vault-signed release authorization
        id: authorization
        shell: bash
        env:
          TRIGGER_TAG: ${{ inputs.oidc_trigger_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TRIGGER_TAG" =~ ^coord-pypi-v([0-9]+\.[0-9]+\.[0-9]+)-([0-9a-f]{32})$ ]]; then
            echo "::error::invalid PyPI OIDC trigger tag: $TRIGGER_TAG" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          operation_id="${BASH_REMATCH[2]}"

          trigger_ref="refs/oidc/${GITHUB_RUN_ID}"
          git fetch --force origin "refs/tags/${TRIGGER_TAG}:${trigger_ref}"
          source_commit="$(git rev-parse "${trigger_ref}^{}")"
          printf '%s\n' "$source_commit" | grep -Eq '^[0-9a-f]{40}$'
          payload="$(git for-each-ref --format='%(contents)' "$trigger_ref")"
          python3 - "$payload" <<'PY'
          import sys

          lines = sys.argv[1].splitlines()
          if len(lines) != 3 or lines[0] != "coord-pypi-trigger-v1":
              raise SystemExit("unsupported or non-canonical PyPI trigger payload")
          if not lines[1].startswith("statement_base64="):
              raise SystemExit("non-canonical PyPI trigger statement field")
          if not lines[2].startswith("bundle_base64="):
              raise SystemExit("non-canonical PyPI trigger bundle field")
          PY
          field() {
            printf '%s\n' "$payload" \
              | awk -F= -v field="$1" '$1 == field { sub(/^[^=]*=/, ""); print; exit }'
          }
          statement_b64="$(field statement_base64)"
          bundle_b64="$(field bundle_base64)"
          [ -n "$statement_b64" ] && [ -n "$bundle_b64" ] || {
            echo "::error::trigger is missing its signed release authorization" >&2
            exit 1
          }
          printf '%s' "$statement_b64" \
            | python3 -c 'import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.read(), validate=True))' \
            > "$RUNNER_TEMP/release-statement"
          printf '%s' "$bundle_b64" \
            | python3 -c 'import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.read(), validate=True))' \
            > "$RUNNER_TEMP/release-bundle.json"
          cosign verify-blob \
            --key release/coord-release.pub \
            --bundle "$RUNNER_TEMP/release-bundle.json" \
            "$RUNNER_TEMP/release-statement" >/dev/null

          statement="$(
            cat "$RUNNER_TEMP/release-statement"
          )"
          python3 - "$statement" <<'PY'
          import sys

          lines = sys.argv[1].splitlines()
          expected_keys = [
              "coord-pypi-authorization-v2",
              "operation_id=",
              "version=",
              "commit=",
              "image=",
              "packages=",
              "build_python=",
              "publisher=",
          ]
          if len(lines) != len(expected_keys):
              raise SystemExit("non-canonical release authorization line count")
          for line, prefix in zip(lines, expected_keys, strict=True):
              if not line.startswith(prefix):
                  raise SystemExit(
                      f"non-canonical release authorization field: expected {prefix!r}"
                  )
          PY
          statement_field() {
            printf '%s\n' "$statement" \
              | awk -F= -v field="$1" '$1 == field { sub(/^[^=]*=/, ""); print; exit }'
          }
          [ "$(printf '%s\n' "$statement" | head -n 1)" = "coord-pypi-authorization-v2" ]
          [ "$(statement_field operation_id)" = "$operation_id" ]
          [ "$(statement_field version)" = "$version" ]
          [ "$(statement_field commit)" = "$source_commit" ]
          [ "$(statement_field publisher)" = \
            "github-oidc:amittell/coord:.github/workflows/release.yml:pypi" ]
          image="$(statement_field image)"
          packages="$(statement_field packages)"
          build_python="$(statement_field build_python)"
          printf '%s\n' "$image" \
            | grep -Eq '^whcr\.io/alexm/coord@sha256:[0-9a-f]{64}$'
          printf '%s\n' "$build_python" | grep -Eq '^3\.(11|12|13|14)$'
          python3 - "$packages" <<'PY'
          import json
          import re
          import sys

          packages = json.loads(sys.argv[1])
          if not isinstance(packages, dict) or not packages:
              raise SystemExit("empty package fingerprint")
          for name, digest in packages.items():
              if "/" in name or name in {".", ".."}:
                  raise SystemExit(f"unsafe package name: {name!r}")
              if not isinstance(digest, str) or re.fullmatch(r"[0-9a-f]{64}", digest) is None:
                  raise SystemExit(f"invalid digest for {name!r}")
          PY
          {
            echo "version=$version"
            echo "source_commit=$source_commit"
            echo "operation_id=$operation_id"
            echo "image=$image"
            echo "packages=$packages"
            echo "build_python=$build_python"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the signed release source without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ steps.authorization.outputs.source_commit }}
          path: release-source
          persist-credentials: false

      - name: Match signed source version
        env:
          VERSION: ${{ steps.authorization.outputs.version }}
        run: |
          pyproject_version="$(
            python3 -c 'import tomllib; print(tomllib.load(open("release-source/pyproject.toml","rb"))["project"]["version"])'
          )"
          [ "$VERSION" = "$pyproject_version" ] || {
            echo "::error::signed version $VERSION does not match release source $pyproject_version" >&2
            exit 1
          }

      - name: Verify authenticated WHCR release candidate
        env:
          IMAGE: ${{ steps.authorization.outputs.image }}
        run: |
          python3 scripts/verify_image_attestations.py \
            --image "$IMAGE" \
            --builder-id https://writhub.io/alexm/coord/builders/github-free-release/v1 \
            --platform linux/amd64 \
            --platform linux/arm64
          cosign verify \
            --key release/coord-release.pub \
            "$IMAGE" >/dev/null

      - name: Set up signed build Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ steps.authorization.outputs.build_python }}

      - name: Install hash-locked build frontend and backend
        working-directory: release-source
        run: python -m pip install --require-hashes -r requirements-build.txt

      - name: Build sdist + wheel
        working-directory: release-source
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          python -m build --no-isolation

      - name: Match exact Vault-authorized package hashes
        env:
          EXPECTED_PACKAGES: ${{ steps.authorization.outputs.packages }}
        run: |
          actual="$(
            python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          print(json.dumps(
              {
                  path.name: hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in sorted(Path("release-source/dist").iterdir())
                  if path.is_file()
              },
              sort_keys=True,
              separators=(",", ":"),
          ))
          PY
          )"
          [ "$actual" = "$EXPECTED_PACKAGES" ] || {
            echo "::error::rebuilt package hashes differ from the signed release authorization" >&2
            exit 1
          }

      - name: Preserve the exact verified package bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coord-pypi-${{ steps.authorization.outputs.operation_id }}
          path: release-source/dist/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Package build code ran in authorize-pypi, so PyPI state classification
  # happens on a fresh runner. This job executes no signed source or package
  # code: it checks out only locked-main verifier code, downloads the exact
  # same-run artifact, rehashes it, and classifies remote state.
  gate-pypi:
    name: Gate protected PyPI environment
    needs: authorize-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      state: ${{ steps.pypi-state.outputs.state }}
    steps:
      - name: Check out locked-main verifier without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Download exact package bytes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: coord-pypi-${{ needs.authorize-pypi.outputs.operation_id }}
          path: dist

      - name: Recheck exact signed package hashes
        env:
          EXPECTED_PACKAGES: ${{ needs.authorize-pypi.outputs.packages }}
        run: |
          actual="$(
            python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          print(json.dumps(
              {
                  path.name: hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in sorted(Path("dist").iterdir())
                  if path.is_file()
              },
              sort_keys=True,
              separators=(",", ":"),
          ))
          PY
          )"
          [ "$actual" = "$EXPECTED_PACKAGES" ] || {
            echo "::error::fresh-gate package hashes differ from signed authorization" >&2
            exit 1
          }

      - name: Classify existing PyPI release
        id: pypi-state
        env:
          VERSION: ${{ needs.authorize-pypi.outputs.version }}
        run: |
          result="$(
            python3 scripts/check_pypi_release.py \
              --project coord-mcp-server \
              --version "$VERSION" \
              --dist-dir dist
          )"
          state="${result%%|*}"
          case "$state" in
            absent | partial | exact) ;;
            *)
              echo "::error::unexpected PyPI state: $state" >&2
              exit 1
              ;;
          esac
          echo "state=$state" >> "$GITHUB_OUTPUT"

  # The protected environment is entered only after the unprivileged
  # authorization job has verified the Vault signature, image, and package
  # bytes. This avoids presenting reviewers with approval prompts for forged
  # tags. The OIDC job executes no repository or package build code: it only
  # downloads the verified artifact, rehashes it with runner Python, and calls
  # the pinned publisher action.
  publish-pypi:
    name: Publish Python package to PyPI
    needs:
      - postgres-gate
      - authorize-pypi
      - gate-pypi
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/main'
      && (
        needs.gate-pypi.outputs.state == 'absent'
        || needs.gate-pypi.outputs.state == 'partial'
      )
    environment:
      name: pypi
      url: https://pypi.org/p/coord-mcp-server
    permissions:
      id-token: write       # required for OIDC trusted publishing
      actions: read         # download this run's verified artifact
    steps:
      - name: Download exact package bytes from the unprivileged gate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: coord-pypi-${{ needs.authorize-pypi.outputs.operation_id }}
          path: dist

      - name: Recheck exact signed package hashes
        env:
          EXPECTED_PACKAGES: ${{ needs.authorize-pypi.outputs.packages }}
        run: |
          actual="$(
            python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          print(json.dumps(
              {
                  path.name: hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in sorted(Path("dist").iterdir())
                  if path.is_file()
              },
              sort_keys=True,
              separators=(",", ":"),
          ))
          PY
          )"
          [ "$actual" = "$EXPECTED_PACKAGES" ] || {
            echo "::error::OIDC-job package hashes differ from the signed release authorization" >&2
            exit 1
          }

      # PyPI has no atomic create-version transaction. Recheck the exact
      # remote subset immediately before the publisher action to narrow the
      # gate/publish race without executing repository code in this job.
      - name: Recheck PyPI subset immediately before OIDC publish
        id: pypi-state
        env:
          VERSION: ${{ needs.authorize-pypi.outputs.version }}
          EXPECTED_PACKAGES: ${{ needs.authorize-pypi.outputs.packages }}
        run: |
          state="$(
            python3 - "$VERSION" "$EXPECTED_PACKAGES" <<'PY'
          import json
          import sys
          import urllib.error
          import urllib.request

          version = sys.argv[1]
          expected = json.loads(sys.argv[2])
          try:
              with urllib.request.urlopen(
                  f"https://pypi.org/pypi/coord-mcp-server/{version}/json",
                  timeout=20,
              ) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              payload = {"urls": []}

          remote = {}
          for row in payload.get("urls", []):
              name = row["filename"]
              digest = row["digests"]["sha256"]
              if name in remote and remote[name] != digest:
                  raise SystemExit(f"conflicting duplicate PyPI filename: {name}")
              remote[name] = digest
          for name, digest in remote.items():
              if expected.get(name) != digest:
                  raise SystemExit(
                      f"PyPI contains unauthorized artifact {name} ({digest})"
                  )
          if remote == expected:
              print("exact")
          elif remote:
              print("partial")
          else:
              print("absent")
          PY
          )"
          case "$state" in
            absent | partial | exact) ;;
            *)
              echo "::error::unexpected immediate PyPI state: $state" >&2
              exit 1
              ;;
          esac
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Publish to PyPI
        if: steps.pypi-state.outputs.state != 'exact'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.13.0
        with:
          # Trusted publisher exchange happens automatically when the
          # workflow's OIDC token is presented to PyPI; no api token needed.
          # The preceding classifier proved any existing files are an exact
          # local subset, so skip-existing resumes only that safe state.
          skip-existing: true

  verify-pypi:
    name: Verify complete exact PyPI artifact set
    needs:
      - authorize-pypi
      - publish-pypi
    if: >-
      always()
      && needs.authorize-pypi.result == 'success'
      && needs.publish-pypi.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out protected-main release verifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Download exact package bytes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: coord-pypi-${{ needs.authorize-pypi.outputs.operation_id }}
          path: dist

      - name: Verify complete exact PyPI artifact set
        env:
          VERSION: ${{ needs.authorize-pypi.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5; do
            result="$(
              python3 scripts/check_pypi_release.py \
                --project coord-mcp-server \
                --version "$VERSION" \
                --dist-dir dist
            )"
            [ "$result" = "exact" ] && exit 0
            [ "$attempt" -eq 5 ] || sleep 2
          done
          echo "::error::PyPI did not converge to the exact complete artifact set: $result" >&2
          exit 1
