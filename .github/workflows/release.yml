name: release candidate validation

on:
  # The authoritative publisher is scripts/release.sh, backed by the
  # repository's committed release key and immutable WritHub release lock.
  # GitHub Actions intentionally has no tag trigger and cannot publish an
  # official image tag, PyPI artifact, GitHub Release, or deployment bump.
  workflow_dispatch:
    inputs:
      version:
        description: "Candidate label (e.g. v0.49.0-review1); never promoted to an official tag."
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

# Serialize candidate labels because registry tag creation is not an atomic
# create-if-absent operation.
concurrency:
  group: ${{ github.workflow }}-candidate-publisher
  cancel-in-progress: false

# Registry and repo name are overridable via repo/org Actions variables so
# GitHub Enterprise users can point at their own container registry without
# forking the workflow. Defaults preserve the upstream GHCR behavior.
#   vars.IMAGE_REGISTRY -> e.g. containers.ghe.example.com
#   vars.IMAGE_REPO     -> e.g. platform/coord
# The format() call wraps the default so an unset vars.IMAGE_REPO (empty
# string) still picks up the owner-prefixed fallback rather than leaking an
# empty value through the || operator.
env:
  REGISTRY: ${{ vars.IMAGE_REGISTRY || 'ghcr.io' }}
  IMAGE_REPO: ${{ vars.IMAGE_REPO || format('{0}/coord', github.repository_owner) }}
  BUILDER_ID: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  # A release is the final point at which dormant-but-supported PostgreSQL
  # regressions must be caught. Reuse the same real-Postgres full suite that
  # runs on backend-sensitive PRs; publishing cannot start until it passes.
  postgres-gate:
    name: Verify PostgreSQL backend before publishing
    uses: ./.github/workflows/postgres.yml

  publish-image:
    name: Build, authenticate, and retain candidate image
    needs: postgres-gate
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ vars.IMAGE_REGISTRY || 'ghcr.io' }}/${{ vars.IMAGE_REPO || format('{0}/coord', github.repository_owner) }}
    outputs:
      image-name: ${{ steps.image.outputs.name }}
      image-digest: ${{ steps.build.outputs.digest }}
      version-tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3  # v4.1.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Log in to container registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive lowercase image name
        id: image
        env:
          RAW_IMAGE: ${{ env.IMAGE_NAME }}
        run: |
          lower=$(printf '%s' "$RAW_IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "name=$lower" >> "$GITHUB_OUTPUT"

      - name: Resolve candidate label
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          tag="$INPUT_VERSION"
          if [ -z "$tag" ]; then
            echo "::error::could not resolve candidate label" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install pinned crane for fail-closed tag checks
        shell: bash
        run: |
          archive="$RUNNER_TEMP/go-containerregistry_Linux_x86_64.tar.gz"
          curl --fail --location --retry 3 \
            --output "$archive" \
            https://github.com/google/go-containerregistry/releases/download/v0.21.7/go-containerregistry_Linux_x86_64.tar.gz
          printf '%s  %s\n' \
            1a57bc98207fa1c0d04bf760699099e26f8383499bfd55b99c1b919a928a7230 \
            "$archive" \
            | sha256sum --check -
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" crane
          test "$("$RUNNER_TEMP/crane" version)" = "0.21.7"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Compose candidate image tag
        id: tags
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.version.outputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo 'tags<<EOF'
            echo "${IMAGE}:candidate-${VERSION}-${COMMIT_SHA:0:12}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # Candidate writes are create-only too. Authentication, transport, and
      # server failures are not evidence that the tag is absent.
      - name: Refuse to republish an existing candidate tag
        env:
          CANDIDATE: ${{ steps.tags.outputs.tags }}
        run: |
          probe_error="$(mktemp)"
          trap 'rm -f "$probe_error"' EXIT
          if crane digest "$CANDIDATE" >/dev/null 2>"$probe_error"; then
            echo "::error::$CANDIDATE already exists in the registry" >&2
            exit 1
          fi
          if ! grep -Fq "MANIFEST_UNKNOWN" "$probe_error"; then
            cat "$probe_error" >&2
            echo "::error::could not prove $CANDIDATE is absent" >&2
            exit 1
          fi

      # BuildKit-native supply-chain signals:
      #  - sbom: true emits an SPDX SBOM as an attestation attached to the
      #    image manifest (separate OCI artifact referenced by the index).
      #  - provenance: mode=max emits a SLSA provenance attestation with
      #    full build metadata (source, builder, materials, invocation).
      # These live in the registry next to the image and can be inspected
      # with `docker buildx imagetools inspect <ref> --format '{{json .SBOM}}'`
      # or pulled via `cosign download sbom <ref>`.
      - name: Build and push image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          sbom: generator=docker.io/docker/buildkit-syft-scanner@sha256:79e7b013cbec16bbb436f312819a49a4a57752b2270c1a9332ae1a10fcc82a68
          provenance: mode=max,builder-id=${{ env.BUILDER_ID }}

      # Emit an SLSA build provenance attestation for the pushed image.
      # Consumers can verify supply-chain integrity with `gh attestation verify`.
      # Requires id-token: write + attestations: write (declared above).
      #
      # actions/attest-build-provenance requires GitHub Enterprise Server
      # 3.10 or later with the attestations feature enabled. Operators on
      # older GHES (or any environment where the API is unavailable) can
      # set the repo/org variable SKIP_ATTESTATION=true to bypass this step
      # without editing the workflow.
      - name: Attest build provenance
        if: ${{ vars.SKIP_ATTESTATION != 'true' }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify both platform SBOM and provenance attestations
        env:
          IMAGE_AND_DIGEST: "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"
        run: |
          python3 scripts/verify_image_attestations.py \
            --image "$IMAGE_AND_DIGEST" \
            --builder-id "$BUILDER_ID" \
            --platform linux/amd64 \
            --platform linux/arm64

      # Candidate authentication never has an unsigned escape hatch. This
      # keyless identity is deliberately candidate-only; official releases
      # use release/coord-release.pub through scripts/release.sh.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.0.6"

      - name: Sign and verify candidate digest with workflow identity
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_AND_DIGEST: "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"
          EXPECTED_IDENTITY: "https://github.com/${{ github.workflow_ref }}"
        run: |
          cosign sign --yes "${IMAGE_AND_DIGEST}"
          cosign verify \
            --certificate-identity "$EXPECTED_IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE_AND_DIGEST" >/dev/null

  # Disabled historical PyPI publisher. It stays visible while operators
  # remove the old GitHub trusted-publisher registration, but cannot run.
  #   project name = coord-mcp-server
  #   owner        = amittell
  #   repo         = coord
  #   workflow     = release.yml
  #   environment  = pypi
  publish-pypi:
    name: Publish Python package to PyPI
    needs: [postgres-gate, publish-image]
    runs-on: ubuntu-latest
    # Historical implementation retained for operator reference only. The
    # authoritative scripts/release.sh path owns PyPI publication.
    if: github.event_name == 'push'
    environment:
      name: pypi
      url: https://pypi.org/p/coord-mcp-server
    permissions:
      id-token: write       # required for OIDC trusted publishing
      contents: read        # required for checkout
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.14"

      - name: Install hash-locked build frontend and backend
        run: python -m pip install --require-hashes -r requirements-build.txt

      - name: Verify tag matches pyproject version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          pyproject_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          tag_version="${REF_NAME#v}"
          if [ "$pyproject_version" != "$tag_version" ]; then
            echo "::error::pyproject.toml version ($pyproject_version) does not match git tag ($tag_version)" >&2
            exit 1
          fi
          echo "Version match: $pyproject_version == $tag_version"

      - name: Build sdist + wheel
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          python -m build --no-isolation

      - name: Classify existing PyPI release
        id: pypi-state
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          result="$(
            python scripts/check_pypi_release.py \
              --project coord-mcp-server \
              --version "${VERSION#v}" \
              --dist-dir dist
          )"
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "state=${result%%|*}" >> "$GITHUB_OUTPUT"

      - name: Publish to PyPI
        if: steps.pypi-state.outputs.state != 'exact'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.13.0
        with:
          # Trusted publisher exchange happens automatically when the
          # workflow's OIDC token is presented to PyPI; no api token needed.
          # The preceding classifier proved any existing files are an exact
          # local subset, so skip-existing resumes only that safe state.
          skip-existing: true

      - name: Verify complete exact PyPI artifact set
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          for attempt in 1 2 3 4 5; do
            result="$(
              python scripts/check_pypi_release.py \
                --project coord-mcp-server \
                --version "${VERSION#v}" \
                --dist-dir dist
            )"
            [ "$result" = "exact" ] && exit 0
            [ "$attempt" -eq 5 ] || sleep 2
          done
          echo "::error::PyPI did not converge to the exact complete artifact set: $result" >&2
          exit 1

  # Disabled historical manifest publisher. Production promotion is owned by
  # the GitOps release train, never by this candidate validation workflow.
  bump-manifest:
    name: Bump prod deployment manifest
    runs-on: ubuntu-latest
    needs: publish-image
    # Production promotion is GitOps-owned and never runs from this candidate
    # validation workflow.
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Land the bump on main, not on the tag ref. The tag is
          # immutable; what ArgoCD watches is the moving main branch.
          ref: main
          fetch-depth: 0
          # Default GITHUB_TOKEN has contents:write at the workflow level,
          # which lets a subsequent `git push origin HEAD:main` succeed.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rewrite image pin in deploy/k8s/prod/deployment.yaml
        env:
          IMAGE: ${{ needs.publish-image.outputs.image-name }}
          VERSION: ${{ needs.publish-image.outputs.version-tag }}
          DIGEST: ${{ needs.publish-image.outputs.image-digest }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          manifest = pathlib.Path("deploy/k8s/prod/deployment.yaml")
          image = os.environ["IMAGE"]
          version = os.environ["VERSION"]
          digest = os.environ["DIGEST"]
          if not (image and version and digest):
              raise SystemExit(
                  f"missing required input: IMAGE={image!r} VERSION={version!r} "
                  f"DIGEST={digest!r}"
              )

          target = f"{image}:{version}@{digest}"
          text = manifest.read_text(encoding="utf-8")
          # The pinned reference lives on the first `image:` line in the
          # Deployment spec; match its leading indent and value.
          pattern = re.compile(r"^(\s*image:\s+)\S+(\s*)$", re.MULTILINE)
          new_text, count = pattern.subn(rf"\g<1>{target}\g<2>", text, count=1)
          if count != 1:
              raise SystemExit(
                  f"no image: line matched in {manifest}; cannot auto-bump"
              )
          if new_text == text:
              print(f"manifest already pins {target}; nothing to do")
              raise SystemExit(0)
          manifest.write_text(new_text, encoding="utf-8")
          print(f"updated {manifest} -> {target}")
          PY

      - name: Commit and push deployment manifest
        env:
          VERSION: ${{ needs.publish-image.outputs.version-tag }}
          DIGEST: ${{ needs.publish-image.outputs.image-digest }}
        run: |
          # Identity matches the GitHub Actions bot so the commit shows
          # up cleanly in repo history.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git diff --quiet -- deploy/k8s/prod/deployment.yaml; then
            echo "deploy/k8s/prod/deployment.yaml unchanged after rewrite; skipping commit"
            exit 0
          fi

          git add deploy/k8s/prod/deployment.yaml
          # `[skip ci]` in the commit message is a GitHub Actions
          # convention: any workflow triggered by this push is skipped.
          # release.yml only triggers on tag pushes, but ci.yml would
          # otherwise run a full test matrix on a
          # one-line manifest change. ArgoCD watches git directly
          # and reconciles regardless of CI status.
          git commit \
            -m "ops: bump prod deployment to ${VERSION}" \
            -m "Automated by .github/workflows/release.yml after the publish-image job for ${VERSION} succeeded. Image digest: ${DIGEST}." \
            -m "[skip ci]"

          # Rebase against any commits that landed on main while the
          # release was building, then push. Failure here surfaces to
          # the operator instead of silently leaving the manifest behind.
          git pull --rebase origin main
          git push origin HEAD:main
