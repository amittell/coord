name: compatibility

on:
  schedule:
    # Once a week catches ecosystem drift without charging every PR.
    - cron: "17 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: full suite (${{ matrix.os }} py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intermediate Python compatibility, which adds little signal on
          # each PR beyond the 3.11 floor and 3.14 production runtime.
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          # Full suites on supported developer platforms. PRs run only the
          # tests carrying the `platform` marker on these expensive runners.
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run full SQLite suite
        run: pytest -q
