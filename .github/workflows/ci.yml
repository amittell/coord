name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Cancel superseded CI runs on the same ref to save minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }} py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    # Force bash on all runners so quoting and pipelines behave consistently.
    # Windows GHA runners ship Git for Windows' bash at /usr/bin/bash.
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install project with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest -q

  test-postgres:
    name: test (postgres backend)
    runs-on: ubuntu-latest
    # The default `test` matrix exercises the SQLite backend only. The HA
    # re-architecture adds a PostgresStore selected by COORD_DATABASE_URL;
    # this job runs the same suite against a real Postgres so the PG path
    # (dialect adapter, advisory-lock grant unit-of-work, leader lease) is
    # actually gated on every PR rather than validated by local runs alone.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coord
          POSTGRES_PASSWORD: coord
          POSTGRES_DB: coord
        ports:
          - 5432:5432
        # Wait for the server to accept connections before the job starts.
        options: >-
          --health-cmd "pg_isready -U coord"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      # The asyncpg driver lives in the optional `postgres` extra, so install
      # it alongside `dev`; the SQLite matrix deliberately does not pull it in.
      - name: Install project with dev + postgres extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,postgres]"

      - name: Run tests against Postgres
        env:
          COORD_DATABASE_URL: postgresql://coord:coord@localhost:5432/coord
        run: pytest -q

  lint-workflows:
    name: lint workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Run actionlint
        uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d  # v1.72.0
        with:
          reporter: github-check
          level: error
          fail_level: error

  type-check:
    name: type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install project with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run mypy
        run: mypy coordination

  otel:
    name: otel tracing tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-otel.txt

      # The OpenTelemetry SDK is an optional extra, so the main test matrix
      # (installed with just [dev]) skips the enabled-path tracing tests.
      # Install the pinned tracing stack here so those tests actually run.
      - name: Install project with dev extras + pinned OpenTelemetry stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" -r requirements-otel.txt

      - name: Run OpenTelemetry tracing tests (enabled path)
        run: pytest tests/test_otel.py -q

  docker-build:
    name: docker build smoke
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      # Build the image once (amd64 only, no push) to catch Dockerfile
      # regressions on every PR without spending time on multi-arch.
      - name: Build image (no push)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: coord:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
