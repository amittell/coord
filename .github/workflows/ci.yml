name: ci

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

# Cancel superseded CI runs on the same ref to save minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (ruff, mypy, otel)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.14"

      # Keep lint/type checks single-shot. Installing the pinned optional
      # tracing stack here also exercises OTel's enabled path without a
      # separate runner.
      - name: Install quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" -r requirements-otel.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run mypy
        run: mypy coordination

      - name: Run OpenTelemetry enabled-path tests
        run: pytest tests/test_otel.py -q

  test:
    name: sqlite (ubuntu py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the advertised floor; 3.14 is the release-image runtime.
        # Intermediate-version and full platform coverage run weekly.
        python-version:
          - "3.11"
          - "3.14"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run full SQLite suite
        run: pytest -q

  platform:
    name: platform smoke (${{ matrix.os }} py3.14)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    # Git for Windows supplies bash; using one shell keeps hook and quoting
    # behavior consistent between the two platform runners.
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.14"

      # These tests exercise OS-facing process, path, permissions, and shell
      # behavior. They do not need lint/type/OTel or the tree-sitter grammar
      # stack carried by the full dev extra.
      - name: Install project and focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . \
            "pytest>=9.0.3" \
            "pytest-asyncio>=1.4.0" \
            "pytest-timeout>=2.3.1"

      - name: Run platform-specific smoke suite
        run: pytest -q -m platform

  lint-workflows:
    name: lint workflows (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Run actionlint
        uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d  # v1.72.0
        with:
          reporter: github-check
          level: error
          fail_level: error

  docker-build:
    name: docker SQLite readiness smoke
    # The SQLite legs are the long pole, so these cheap gates normally finish
    # first. If they fail, avoid paying for a Docker build of invalid code.
    needs: [quality, test, lint-workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # build-push-action otherwise uploads a build-record artifact for every
      # ephemeral PR build even though this job neither pushes nor publishes.
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Build image (no push)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: coord:ci
          cache-from: type=gha,scope=docker-ci
          # PR merge refs are ephemeral and their caches cannot help later
          # branches. Only main refreshes the shared, minimal build cache.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=docker-ci,mode=min' || '' }}

      - name: Build PostgreSQL derivative and verify pinned driver
        shell: bash
        run: |
          if docker build \
            --file Dockerfile.postgres \
            --build-arg COORD_BASE=coord:ci \
            --tag coord:must-not-build \
            .; then
            echo "::error::PostgreSQL derivative accepted an unpinned base without the CI override" >&2
            exit 1
          fi
          docker build \
            --file Dockerfile.postgres \
            --build-arg COORD_BASE=coord:ci \
            --build-arg ALLOW_UNPINNED_BASE=1 \
            --tag coord:ci-postgres \
            .
          docker run --rm --entrypoint python coord:ci-postgres -c \
            'import asyncpg, coordination; assert asyncpg.__version__ == "0.31.0"; print(coordination.__version__, asyncpg.__version__)'

      - name: Verify PostgreSQL derivative readiness and session lifecycle
        shell: bash
        run: |
          network=coord-ci-postgres
          database=coord-ci-postgres-db
          api=coord-ci-postgres-api
          cleanup() {
            docker logs "$api" 2>/dev/null || true
            docker logs "$database" 2>/dev/null || true
            docker rm --force "$api" "$database" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "$network"
          docker run --detach \
            --name "$database" \
            --network "$network" \
            --env POSTGRES_USER=coord \
            --env POSTGRES_PASSWORD=coord \
            --env POSTGRES_DB=coord \
            postgres:16.14@sha256:be01cf82fc7dbba824acf0a82e150b4b360f3ff93c6631d7844af431e841a95c

          database_ready=0
          for _ in {1..30}; do
            if docker exec "$database" pg_isready --username coord --dbname coord; then
              database_ready=1
              break
            fi
            sleep 1
          done
          if [ "$database_ready" -ne 1 ]; then
            echo "::error::PostgreSQL did not become ready" >&2
            exit 1
          fi

          docker run --detach \
            --name "$api" \
            --network "$network" \
            --publish 127.0.0.1:18081:8080 \
            --env COORD_AUTH_TOKEN=ci-smoke \
            --env COORD_DATABASE_URL=postgresql://coord:coord@coord-ci-postgres-db:5432/coord \
            --env COORD_POSTGRES_SCHEMA=coord \
            coord:ci-postgres

          api_ready=0
          for _ in {1..30}; do
            if body="$(curl --fail --silent http://127.0.0.1:18081/readyz)" \
              && READY_BODY="$body" python -c 'import json, os; data=json.loads(os.environ["READY_BODY"]); assert data["status"] == "ready"'; then
              api_ready=1
              break
            fi
            sleep 1
          done
          if [ "$api_ready" -ne 1 ]; then
            echo "::error::PostgreSQL derivative did not become ready" >&2
            exit 1
          fi

          curl --fail --silent --request POST \
            --header "Authorization: Bearer ci-smoke" \
            http://127.0.0.1:18081/sessions/ci-release/open >/dev/null
          curl --fail --silent --request POST \
            --header "Authorization: Bearer ci-smoke" \
            http://127.0.0.1:18081/sessions/ci-release/release >/dev/null
          check_status="$(
            curl --silent --output /tmp/session-check.json --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer ci-smoke" \
              http://127.0.0.1:18081/sessions/ci-release/check
          )"
          CHECK_STATUS="$check_status" python -c \
            'import json, os; data=json.load(open("/tmp/session-check.json")); assert os.environ["CHECK_STATUS"] == "409"; assert data["code"] == "session_closed"; assert data["session_id"] == "ci-release"'

      - name: Start image and verify real SQLite readiness
        shell: bash
        run: |
          container_id="$(docker run --detach --env COORD_AUTH_TOKEN=ci-smoke --publish 127.0.0.1:18080:8080 coord:ci)"
          cleanup() {
            docker logs "$container_id" || true
            docker rm --force "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for _ in {1..30}; do
            if body="$(curl --fail --silent http://127.0.0.1:18080/readyz)" \
              && READY_BODY="$body" python -c 'import json, os; assert json.loads(os.environ["READY_BODY"])["status"] == "ready"'; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::container did not become ready with SQLite" >&2
            exit 1
          fi

          docker exec "$container_id" python -c \
            'import importlib.util, sqlite3; assert importlib.util.find_spec("asyncpg") is None; c = sqlite3.connect("/data/coordination.db"); assert c.execute("SELECT count(*) FROM sqlite_master WHERE type = ?", ("table",)).fetchone()[0] > 0'
