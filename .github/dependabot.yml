version: 2
updates:
  # Keep all third-party Actions current. Workflows pin by full commit SHA
  # with the readable version in a trailing comment; Dependabot updates
  # both the SHA and the comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions-all:
        patterns:
          - "*"

  # Python runtime dependencies pinned in requirements.txt at repo root.
  # Group minor + patch into one PR per week; keep majors separate so they
  # get a focused review.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Dockerfile base image. Group minor + patch updates; majors stay split.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      docker-minor-patch:
        update-types:
          - "minor"
          - "patch"
