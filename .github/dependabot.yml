version: 2
updates:
  # Python dependencies declared in the root pyproject.toml. Group
  # patch + minor bumps together so they land as a single PR per week;
  # majors still open as their own PR for focused review.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # pydantic-core ships independently of pydantic, but every
      # pydantic release strictly pins a single pydantic-core
      # version (e.g. pydantic 2.13.4 requires
      # pydantic-core==2.46.4 exactly). Letting dependabot bump
      # pydantic-core on its own produces an UNSAT lockfile that
      # docker build smoke catches as `ResolutionImpossible`.
      # Re-allow these bumps once pydantic releases 2.14+ with a
      # newer core (then pydantic-core will move as part of the
      # python-minor-and-patch group bump, not as a standalone PR).
      # PR #22 (closed 2026-06-08) was the second time this issue
      # bit; first was PR #17 -> v0.28.4 hotfix.
      - dependency-name: "pydantic-core"

  # GitHub Actions used in .github/workflows/. Dependabot is allowed
  # to auto-update action SHAs here, which is the whole point of the
  # pinning discipline. Group patch + minor bumps; majors stay
  # individual.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Dockerfile base image. Container ships via the release workflow,
  # so keep base-image updates visible. Weekly cadence, all bumps in
  # one PR.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      docker-all:
        patterns:
          - "*"
