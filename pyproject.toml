[project]
name = "multi-agent-coordination"
version = "0.2.1"
description = "Coordination service for multi-engineer agent teams (HTTP API + MCP + dashboard)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "mcp>=1.2.0",
    "httpx>=0.28.0",
    "pathspec>=1.1.1",
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.11",
    "mypy>=1.20.1",
]

[project.scripts]
coord = "coordination.cli:main"
coord-mcp = "coordination.mcp_server:main"
coord-api = "coordination.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coordination"]

[tool.hatch.build.targets.sdist]
include = [
    "coordination",
    "README.md",
    "pyproject.toml",
    "docs",
    "templates",
    "scripts",
    ".env.example",
    "compose.yaml",
    "Dockerfile",
    ".github",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_incomplete_defs = false
no_implicit_optional = true
disable_error_code = ["import-untyped"]
exclude = [
    "^\\.venv/",
    "^build/",
    "^dist/",
    "^tests/",
]

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests that spawn real processes (deselect with -m 'not integration')",
]
